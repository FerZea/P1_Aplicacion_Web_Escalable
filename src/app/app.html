<main class="container">
  <h1 class="title">{{ title() }} ({{ userCounter() }} usuarios)</h1>


  <app-control (orderByIdClick)="orderById()" (orderByNameClick)="orderByName()"
    (reverseClick)="reverse()"></app-control>


  <section class="card-grid">
    @for (user of users(); track $index) {
    <app-user-card [user]="user" (deleteClick)="deleteUser($event)"></app-user-card>
    }
    @empty {
    <p>Directorio vacío</p>
    }
  </section>

</main>
